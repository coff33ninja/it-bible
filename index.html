<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The IT Bible — Warnings From The Department</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root {
    --bg: #0d0d0d;
    --surface: #1a1a1a;
    --surface2: #242424;
    --border: #333;
    --accent: #ff4444;
    --accent2: #ff8800;
    --text: #e0e0e0;
    --text-dim: #888;
    --warning-bg: #1a0a0a;
    --warning-border: #ff444440;
    --green: #44ff44;
    --cyan: #44ddff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
  }

  /* Sidebar */
  .sidebar {
    width: 300px;
    min-width: 300px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    height: 100vh;
    position: sticky;
    top: 0;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .sidebar-header {
    text-align: center;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }

  .sidebar-header h1 {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 1px;
  }

  .sidebar-header h1 span:first-child { color: var(--text); }
  .sidebar-header h1 span:last-child { color: var(--accent); }

  .sidebar-header .subtitle {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-top: 4px;
  }

  .sidebar-header .stats {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 8px;
  }

  .search-box {
    width: 100%;
    padding: 8px 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-box:focus { border-color: var(--accent); }
  .search-box::placeholder { color: var(--text-dim); }

  .chapter-list { display: flex; flex-direction: column; gap: 4px; }

  .chapter-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 6px;
    color: var(--text);
    cursor: pointer;
    font-size: 13px;
    text-align: left;
    transition: all 0.15s;
  }

  .chapter-btn:hover { background: var(--surface2); border-color: var(--border); }
  .chapter-btn.active { background: var(--warning-bg); border-color: var(--warning-border); color: var(--accent); }
  .chapter-btn .num {
    width: 24px;
    height: 24px;
    border-radius: 4px;
    background: var(--surface2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-dim);
    flex-shrink: 0;
  }
  .chapter-btn.active .num { background: var(--accent); color: #fff; }
  .chapter-btn .ch-title { flex: 1; line-height: 1.3; }
  .chapter-btn .ch-count { font-size: 11px; color: var(--text-dim); }

  /* Main content */
  .main {
    flex: 1;
    padding: 32px 48px;
    overflow-y: auto;
    max-width: 900px;
  }

  .chapter-header {
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 2px solid var(--accent);
  }

  .chapter-header h2 {
    font-size: 28px;
    font-weight: 800;
  }

  .chapter-header .chapter-number {
    font-size: 13px;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 3px;
    margin-bottom: 4px;
  }

  .warning-zone-banner {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: rgba(255, 68, 0, 0.08);
    border: 1px solid rgba(255, 68, 0, 0.25);
    border-radius: 6px;
    margin-bottom: 16px;
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .warning-zone-banner .shield {
    font-size: 20px;
  }

  .chapter-header .chapter-stats {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 6px;
  }

  /* Warning cards */
  .warning-card {
    background: var(--warning-bg);
    border: 1px solid var(--warning-border);
    border-radius: 8px;
    padding: 20px 24px;
    margin-bottom: 16px;
    position: relative;
  }

  .warning-card .warning-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 10px;
    line-height: 1.4;
  }

  .warning-card ul {
    list-style: none;
    padding: 0;
  }

  .warning-card li {
    padding: 4px 0 4px 20px;
    position: relative;
    font-size: 14px;
    line-height: 1.5;
    color: var(--text);
  }

  .warning-card li::before {
    content: ">";
    position: absolute;
    left: 0;
    color: var(--accent2);
    font-weight: 700;
  }

  .warning-card li.note {
    margin-top: 8px;
    padding: 8px 12px;
    background: rgba(255, 68, 0, 0.1);
    border-left: 3px solid var(--accent2);
    border-radius: 0 4px 4px 0;
    font-style: italic;
    font-size: 13px;
    color: var(--text-dim);
  }

  .warning-card li.note::before { content: "!"; color: var(--accent2); }

  .warning-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--warning-border);
  }

  .warning-actions button, .copy-all-btn {
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 600;
    border: 1px solid var(--border);
    border-radius: 4px;
    cursor: pointer;
    background: var(--surface2);
    color: var(--text);
    transition: all 0.15s;
  }

  .warning-actions button:hover, .copy-all-btn:hover {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .copy-all-btn {
    margin-bottom: 16px;
    padding: 8px 20px;
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
  }

  .empty-state h3 { font-size: 20px; margin-bottom: 8px; color: var(--text); }
  .empty-state p { font-size: 14px; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    padding: 12px 20px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.3s;
    z-index: 999;
    pointer-events: none;
  }

  .toast.show { opacity: 1; transform: translateY(0); }

  /* Scrollbar */
  .sidebar::-webkit-scrollbar, .main::-webkit-scrollbar { width: 6px; }
  .sidebar::-webkit-scrollbar-track, .main::-webkit-scrollbar-track { background: transparent; }
  .sidebar::-webkit-scrollbar-thumb, .main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  @media (max-width: 768px) {
    body { flex-direction: column; }
    .sidebar {
      width: 100%;
      min-width: unset;
      height: auto;
      max-height: 40vh;
      position: static;
      border-right: none;
      border-bottom: 1px solid var(--border);
    }
    .main { padding: 20px; }
  }
</style>
</head>
<body>

<nav class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h1><span>THE</span> <span>IT</span> <span>BIBLE</span></h1>
    <div class="subtitle">Warnings From The Department</div>
    <div class="stats" id="stats"></div>
  </div>
  <input type="text" class="search-box" id="searchBox" placeholder="Search warnings..." oninput="filterChapters()">
  <div class="chapter-list" id="chapterList"></div>
</nav>

<main class="main" id="mainContent">
  <div class="empty-state" id="welcome">
    <h3>⚠️ THE IT BIBLE</h3>
    <p>Select a chapter from the sidebar to begin.<br>
    <span style="font-size:12px;color:var(--text-dim)">100+ commandments. 15 books of suffering.</span></p>
  </div>
  <div id="chapterContent" style="display:none"></div>
</main>

<div class="toast" id="toast"></div>

<script>
const dataUrl = 'volumes/index.json';
let bible = [];
let currentChapter = null;

async function loadBible() {
  try {
    const res = await fetch(dataUrl);
    bible = await res.json();
    const totalWarnings = bible.reduce((s, c) => s + c.warningCount, 0);
    const totalBullets = bible.reduce((s, c) => s + c.totalBullets, 0);
    document.getElementById('stats').textContent = `${bible.length} books · ${totalWarnings} warnings · ${totalBullets} verses`;
    renderChapterList();
    const hash = window.location.hash.replace('#', '');
    if (hash) {
      const ch = bible.find(c => c.id === hash || c.number === parseInt(hash));
      if (ch) selectChapter(ch);
    }
  } catch (e) {
    document.getElementById('chapterList').innerHTML = '<div style="color:var(--accent);padding:12px;font-size:13px;">Failed to load index.json. Make sure the file exists.</div>';
  }
}

function renderChapterList() {
  const list = document.getElementById('chapterList');
  list.innerHTML = bible.map(ch => `
    <button class="chapter-btn" data-id="${ch.id}" onclick="selectChapter(bible.find(c=>c.id==='${ch.id}'))">
      <span class="num">${ch.number}</span>
      <span class="ch-title">${ch.title}</span>
      <span class="ch-count">${ch.warningCount}</span>
    </button>
  `).join('');
}

function filterChapters() {
  const q = document.getElementById('searchBox').value.toLowerCase();
  document.querySelectorAll('.chapter-btn').forEach(btn => {
    const match = btn.textContent.toLowerCase().includes(q);
    btn.style.display = match ? 'flex' : 'none';
  });
}

function selectChapter(chapter) {
  currentChapter = chapter;
  window.location.hash = chapter.id;
  document.querySelectorAll('.chapter-btn').forEach(b => b.classList.remove('active'));
  const btn = document.querySelector(`.chapter-btn[data-id="${chapter.id}"]`);
  if (btn) btn.classList.add('active');

  const content = document.getElementById('chapterContent');
  const welcome = document.getElementById('welcome');
  welcome.style.display = 'none';
  content.style.display = 'block';

  content.innerHTML = `
    <div class="warning-zone-banner">
      <span class="shield">⚠️</span>
      <span>WARNING: USER ERROR ZONE</span>
    </div>
    <div class="chapter-header">
      <div class="chapter-number">Book ${chapter.number}</div>
      <h2>${chapter.title}</h2>
      <div class="chapter-stats">${chapter.warningCount} warnings · ${chapter.totalBullets} verses</div>
    </div>
    <button class="copy-all-btn" onclick="copyAllWarnings('${chapter.id}')">📋 Copy All Warnings</button>
    <div id="warningsContainer">
      ${chapter.warnings.map((w, i) => renderWarning(chapter.id, i, w)).join('')}
    </div>
  `;

  document.getElementById('mainContent').scrollTop = 0;
}

function renderWarning(chapterId, index, warning) {
  const hasNote = warning.bullets.length > 0 && (warning.bullets[warning.bullets.length - 1] || '').startsWith('Note:');
  const mainBullets = hasNote ? warning.bullets.slice(0, -1) : warning.bullets;
  const note = hasNote ? warning.bullets[warning.bullets.length - 1] : null;

  return `
    <div class="warning-card" data-chapter="${chapterId}" data-index="${index}">
      <div style="font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;opacity:0.7;">⚠️ WARNING: USER ERROR ZONE</div>
      <div class="warning-title">${warning.title}...</div>
      <ul>
        ${mainBullets.map(b => `<li>${b}</li>`).join('')}
        ${note ? `<li class="note">${note}</li>` : ''}
      </ul>
      <div class="warning-actions">
        <button onclick="downloadImage('${chapterId}', ${index})">🖼️ Download Image</button>
        <button onclick="copyWarning('${chapterId}', ${index})">📋 Copy</button>
      </div>
    </div>
  `;
}

function getWarningData(chapterId, index) {
  const ch = bible.find(c => c.id === chapterId);
  if (!ch) return null;
  return { chapter: ch, warning: ch.warnings[index] };
}

function copyWarning(chapterId, index) {
  const data = getWarningData(chapterId, index);
  if (!data) return;
  const text = `${data.warning.title}...\n${data.warning.bullets.map(b => '> ' + b).join('\n')}`;
  navigator.clipboard.writeText(text).then(() => showToast('Copied to clipboard'));
}

function copyAllWarnings(chapterId) {
  const ch = bible.find(c => c.id === chapterId);
  if (!ch) return;
  const text = `${ch.title}\n${'='.repeat(ch.title.length)}\n\n` +
    ch.warnings.map(w =>
      `${w.title}...\n${w.bullets.map(b => '> ' + b).join('\n')}`
    ).join('\n\n---\n\n');
  navigator.clipboard.writeText(text).then(() => showToast(`All ${ch.warningCount} warnings copied`));
}

function downloadImage(chapterId, index) {
  const card = document.querySelector(`.warning-card[data-chapter="${chapterId}"][data-index="${index}"]`);
  if (!card) return;

  const data = getWarningData(chapterId, index);
  if (!data) return;

  // Build a clean clone for rendering
  const clone = card.cloneNode(true);
  clone.style.background = '#1a0a0a';
  clone.style.border = '1px solid #ff444440';
  clone.style.borderRadius = '8px';
  clone.style.padding = '24px';
  clone.style.width = '600px';
  clone.style.fontFamily = "'Segoe UI', system-ui, sans-serif";

  // Remove action buttons from clone
  const actions = clone.querySelector('.warning-actions');
  if (actions) actions.remove();

  // Wrap in a temp container
  const wrapper = document.createElement('div');
  wrapper.style.position = 'fixed';
  wrapper.style.left = '-9999px';
  wrapper.style.top = '0';
  wrapper.style.background = '#0d0d0d';
  wrapper.style.padding = '32px';
  wrapper.appendChild(clone);
  document.body.appendChild(wrapper);

  html2canvas(wrapper, {
    backgroundColor: '#0d0d0d',
    scale: 2,
    logging: false,
    useCORS: true,
  }).then(canvas => {
    const link = document.createElement('a');
    link.download = `${chapterId}-warning-${index + 1}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    document.body.removeChild(wrapper);
    showToast('Image downloaded');
  }).catch(() => {
    document.body.removeChild(wrapper);
    showToast('Failed to render image');
  });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

loadBible();
</script>
</body>
</html>
